
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto Lube House - Money Receipt</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#eee;
    font-family:Georgia,"Times New Roman",serif;
    color:#222;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    position:sticky;
    top:0;
    z-index:100;
    background:#222;
    color:white;
    padding:10px;
    text-align:center;
    font-family:Arial,sans-serif;
}

button{
    padding:9px 18px;
    border:0;
    border-radius:5px;
    background:white;
    cursor:pointer;
    margin:0 4px;
    font-weight:bold;
}

button:hover{
    background:#ddd;
}

#count{
    margin-left:10px;
    font-size:14px;
}

/* =========================
   RECEIPT AREA
========================= */

#receiptsContainer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px 0;
}

/* =========================
   RECEIPT
========================= */

.receipt{
    width:16cm;
    height:8cm;

    background:#f5a8bd;

    padding:0.42cm 0.55cm;

    position:relative;

    overflow:hidden;

    box-shadow:0 0 8px #777;

    flex:none;
}

/* =========================
   HEADER
========================= */

.top{
    position:relative;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    min-height:1.15cm;
}

/* SERVO */

.servo{
    position:absolute;

    left:0;
    top:0;

    font-family:Arial,sans-serif;

    font-weight:900;

    font-size:20px;

    line-height:1;

    color:#333;
}

.servo small{
    display:block;

    font-size:6px;

    letter-spacing:.7px;

    margin-top:2px;
}

/* CENTER TITLE */

.heading{
    width:100%;

    text-align:center;

    line-height:1.05;
}

.title{
    font-size:18px;

    font-weight:bold;

    letter-spacing:.3px;
}

.company{
    font-size:17px;

    font-weight:bold;

    margin-top:2px;
}

.subtitle{
    font-size:8px;

    font-weight:bold;

    font-style:italic;

    margin-top:2px;
}

/* =========================
   SERIAL
========================= */

.sl{
    position:absolute;

    right:5.5mm;
    top:5mm;

    font-size:9px;

    font-weight:bold;
}

.sl input{
    width:22mm !important;

    text-align:center;

    font-weight:bold;

    font-size:9px;
}

/* =========================
   DATE
========================= */

.date{
    position:absolute;

    right:5.5mm;
    top:13mm;

    font-size:9px;
}

.date input{
    width:28mm !important;
}

/* =========================
   FIELDS
========================= */

.field{
    font-size:9px;

    display:flex;

    align-items:baseline;

    gap:4px;
}

label{
    white-space:nowrap;
}

input{
    border:0;

    border-bottom:1px dotted #333;

    background:transparent;

    outline:0;

    font:9px Georgia,"Times New Roman",serif;

    color:#111;

    width:100%;

    padding:1px 2px;
}

/* =========================
   FULL WIDTH
========================= */

.full{
    margin-top:5px;
}

/* =========================
   TWO COLUMNS
========================= */

.row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:5px;
}

/* =========================
   AMOUNT WORDS
========================= */

.bottomline{
    margin-top:6px;
}

/* =========================
   SIGNATURE
========================= */

.signature{
    position:absolute;

    right:7mm;
    bottom:7.5mm;

    font-size:9px;

    font-weight:bold;

    font-style:italic;
}

/* =========================
   COMPANY
========================= */

.for-company{
    position:absolute;

    left:5.5mm;
    bottom:3mm;

    font-weight:bold;

    font-style:italic;

    font-size:9px;
}

/* =========================
   INDIANOIL
========================= */

.brand{
    position:absolute;

    right:5.5mm;
    bottom:2.5mm;

    font-family:Arial,sans-serif;

    font-weight:bold;

    font-size:11px;
}

/* =========================
   DELETE BUTTON
========================= */

.deleteReceipt{
    position:absolute;

    top:2px;
    left:2px;

    background:#b00020;

    color:white;

    font-size:10px;

    padding:3px 7px;

    border-radius:3px;
}

/* =========================
   INSTRUCTIONS
========================= */

.instructions{
    font-family:Arial,sans-serif;

    width:16cm;

    margin:10px auto 15px;

    font-size:13px;

    color:#333;

    text-align:center;
}


/* ==================================================
   PRINT SETTINGS
   3 RECEIPTS = 24 CM HIGH
   A4 = 29.7 CM HIGH
================================================== */

@media print{

    html,
    body{

        width:210mm;

        height:297mm;

        margin:0;

        padding:0;

        background:white;
    }

    .toolbar,
    .instructions,
    .deleteReceipt{

        display:none !important;
    }

    #receiptsContainer{

        width:210mm;

        height:297mm;

        padding:10mm 0 0 0;

        margin:0;

        display:flex;

        flex-direction:column;

        align-items:center;

        gap:3mm;

        overflow:hidden;
    }

    .receipt{

        width:160mm;

        height:80mm;

        margin:0;

        padding:4.2mm 5.5mm;

        box-shadow:none;

        flex:none;

        page-break-inside:avoid;

        break-inside:avoid;
    }

    @page{

        size:A4 portrait;

        margin:0;
    }
}

</style>
</head>

<body>


<!-- =========================
     TOOLBAR
========================= -->

<div class="toolbar">

    <button onclick="addReceipt()">
        ➕ Add Receipt
    </button>

    <button onclick="window.print()">
        🖨 Print A4
    </button>

    <button onclick="clearAll()">
        Clear All
    </button>

    <span id="count">
        Receipts: 1 / 3
    </span>

</div>






<!-- =========================
     RECEIPTS CONTAINER
========================= -->

<div id="receiptsContainer"></div>


<script>

/* ==================================================
   RECEIPT COUNT
================================================== */

let receiptCount = 0;

const MAX_RECEIPTS = 3;


/* ==================================================
   NUMBER TO WORDS
================================================== */

const ones = [
    "",
    "One",
    "Two",
    "Three",
    "Four",
    "Five",
    "Six",
    "Seven",
    "Eight",
    "Nine",
    "Ten",
    "Eleven",
    "Twelve",
    "Thirteen",
    "Fourteen",
    "Fifteen",
    "Sixteen",
    "Seventeen",
    "Eighteen",
    "Nineteen"
];

const tens = [
    "",
    "",
    "Twenty",
    "Thirty",
    "Forty",
    "Fifty",
    "Sixty",
    "Seventy",
    "Eighty",
    "Ninety"
];


function below100(n){

    if(n < 20)
        return ones[n];

    return tens[Math.floor(n / 10)] +
        (n % 10 ? " " + ones[n % 10] : "");
}


function below1000(n){

    if(n < 100)
        return below100(n);

    return ones[Math.floor(n / 100)] +
        " Hundred" +
        (n % 100 ? " " + below100(n % 100) : "");
}


function indianWords(n){

    n = Math.floor(n);

    if(n === 0)
        return "Zero";

    let parts = [];


    if(n >= 10000000){

        parts.push(
            indianWords(
                Math.floor(n / 10000000)
            ) + " Crore"
        );

        n %= 10000000;
    }


    if(n >= 100000){

        parts.push(
            indianWords(
                Math.floor(n / 100000)
            ) + " Lakh"
        );

        n %= 100000;
    }


    if(n >= 1000){

        parts.push(
            indianWords(
                Math.floor(n / 1000)
            ) + " Thousand"
        );

        n %= 1000;
    }


    if(n > 0)
        parts.push(below1000(n));


    return parts.join(" ");
}


function amountToWords(value){

    const num = parseFloat(
        String(value).replace(/,/g,"")
    );

    if(!Number.isFinite(num) || num < 0)
        return "";


    const rupees = Math.floor(num);

    const paise = Math.round(
        (num - rupees) * 100
    );


    let text =
        "Rupees " +
        indianWords(rupees);


    if(paise > 0){

        text +=
            " and " +
            indianWords(paise) +
            " Paise";
    }


    return text + " Only";
}


/* ==================================================
   SERIAL NUMBER
   EXACTLY 6 CHARACTERS
   LETTERS + NUMBERS
================================================== */

function generateSerial(){

    const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const numbers =
        "0123456789";


    /*
       Make sure there is at least
       one letter and one number.
    */

    let serial =
        letters.charAt(
            Math.floor(
                Math.random() *
                letters.length
            )
        );


    serial +=
        numbers.charAt(
            Math.floor(
                Math.random() *
                numbers.length
            )
        );


    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


    while(serial.length < 6){

        serial +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );
    }


    /* Shuffle */

    serial =
        serial
        .split("")
        .sort(
            () => Math.random() - 0.5
        )
        .join("");


    return serial;
}


/* ==================================================
   CREATE RECEIPT
================================================== */

function createReceipt(){

    receiptCount++;


    const receipt =
    document.createElement("form");


    receipt.className = "receipt";

    receipt.id =
        "receipt_" + receiptCount;


    receipt.onsubmit =
        function(){
            return false;
        };


    receipt.innerHTML = `

        <button
            type="button"
            class="deleteReceipt"
            onclick="removeReceipt(${receiptCount})"
        >
            ✕
        </button>


        <!-- HEADER -->

        <div class="top">

            <div class="servo">

                SERVO

                <small>
                    WORLD-CLASS LUBRICANTS
                </small>

            </div>


            <div class="heading">

                <div class="title">
                    MONEY RECEIPT
                </div>

                <div class="company">
                    AUTO LUBE HOUSE
                </div>

                <div class="subtitle">
                    Iewduh, Bara Bazar, Shillong - 793002
                </div>

            </div>

        </div>


        <!-- SERIAL -->

        <div class="sl">

            Sl. No.

            <input
                class="serial"
                name="slno"
                maxlength="6"
                value="${generateSerial()}"
            >

        </div>


        <!-- DATE -->

        <div class="date field">

            <label>Date:</label>

            <input
                type="date"
                name="date"
            >

        </div>


        <!-- RECEIVED FROM -->

        <div class="full field">

            <label>
                Received from:
            </label>

            <input
                name="received_from"
            >

        </div>


        <!-- INVOICE / PAYMENT -->

        <div class="row">

            <div class="field">

                <label>
                    Invoice No.:
                </label>

                <input
                    name="invoice_no"
                >

            </div>


            <div class="field">

                <label>
                    Cheque / Cash:
                </label>

                <input
                    name="payment_mode"
                >

            </div>

        </div>


        <!-- BANK / CHEQUE -->

        <div class="row">

            <div class="field">

                <label>
                    Bank Name:
                </label>

                <input
                    name="bank_name"
                >

            </div>


            <div class="field">

                <label>
                    Cheque No.:
                </label>

                <input
                    name="cheque_no"
                >

            </div>

        </div>


        <!-- CHEQUE DATE / AMOUNT -->

        <div class="row">

            <div class="field">

                <label>
                    Cheque Date:
                </label>

                <input
                    type="date"
                    name="cheque_date"
                >

            </div>


            <div class="field">

                <label>
                    Amount:
                </label>

                <input
                    class="amount"
                    name="amount"
                    inputmode="decimal"
                    placeholder="0.00"
                >

            </div>

        </div>


        <!-- AMOUNT IN WORDS -->

        <div class="bottomline field">

            <label>
                Amount in words:
            </label>

            <input
                class="rupees"
                name="rupees"
                readonly
                placeholder="Amount in words"
            >

        </div>


        <!-- SIGNATURE -->

        <div class="signature">
            Customer's Signature
        </div>


        <!-- COMPANY -->

        <div class="for-company">
            For Auto Lube House
        </div>


        <!-- INDIANOIL -->

        <div class="brand">
            IndianOil
        </div>

    `;


    /* Amount listener */

    const amount =
        receipt.querySelector(".amount");

    const rupees =
        receipt.querySelector(".rupees");


    amount.addEventListener(
        "input",
        function(){

            rupees.value =
                amountToWords(
                    amount.value
                );

        }
    );


    /* Serial validation */

    const serial =
        receipt.querySelector(".serial");


    serial.addEventListener(
        "input",
        function(){

            this.value =
                this.value
                .toUpperCase()
                .replace(
                    /[^A-Z0-9]/g,
                    ""
                )
                .substring(0,6);

        }
    );


    return receipt;
}


/* ==================================================
   ADD RECEIPT
================================================== */

function addReceipt(){

    if(receiptCount >= MAX_RECEIPTS){

        alert(
            "Maximum 3 receipts can be printed on one A4 page."
        );

        return;
    }


    const receipt =
        createReceipt();


    document
        .getElementById("receiptsContainer")
        .appendChild(receipt);


    updateCount();
}


/* ==================================================
   REMOVE RECEIPT
================================================== */

function removeReceipt(id){

    const receipt =
        document.getElementById(
            "receipt_" + id
        );


    if(receipt){

        receipt.remove();

        receiptCount--;

        updateCount();
    }
}


/* ==================================================
   UPDATE COUNTER
================================================== */

function updateCount(){

    document.getElementById("count")
        .textContent =
        "Receipts: " +
        receiptCount +
        " / " +
        MAX_RECEIPTS;
}


/* ==================================================
   CLEAR ALL
================================================== */

function clearAll(){

    if(
        confirm(
            "Clear all receipts?"
        )
    ){

        document
            .getElementById(
                "receiptsContainer"
            )
            .innerHTML = "";

        receiptCount = 0;

        addReceipt();
    }
}


/* ==================================================
   START WITH ONE RECEIPT
================================================== */

addReceipt();

</script>

</body>
</html>

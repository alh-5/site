<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price List Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #0e1e28 0%, #1d3b47 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem;
        }

        h1 {
            color: #f0e6d2;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0.85;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            border-bottom: 2px dashed #4f7a8a;
            padding-bottom: 1rem;
            margin-bottom: 2.5rem;
            width: 100%;
            max-width: 1000px;
        }

        /* ---- BUTTON ROW (separated by commas) ---- */
        .button-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.2rem 0.4rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 1.8rem 1.8rem;
            border-radius: 100px;
            border: 1px solid rgba(255, 215, 140, 0.15);
            box-shadow: 0 20px 40px -15px #000000, inset 0 0 0 1px rgba(255, 245, 200, 0.05);
            width: 100%;
            max-width: 1100px;
        }

        /* ---- LINK BUTTON STYLES ---- */
        .price-link {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 1.1rem 1.6rem;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            white-space: nowrap;
            color: #0e1e28;
            text-decoration: none;
            background: #e8b84b;
            background: linear-gradient(145deg, #f5cd6d, #d9a42e);
            flex: 0 1 auto;
            min-width: 150px;
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .price-link:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 26px -10px #000000, 0 0 0 1px rgba(255, 255, 200, 0.4) inset, 0 0 30px rgba(232, 184, 75, 0.4);
            filter: brightness(1.1);
        }

        .price-link:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 6px 12px -6px #000000, 0 0 0 1px rgba(0, 0, 0, 0.2) inset;
            filter: brightness(0.95);
        }

        /* Individual button color accents */
        .price-link.generator-btn {
            background: linear-gradient(145deg, #f5cd6d, #d9a42e);
            color: #0e1e28;
            font-size: 1.15rem;
            padding: 1.2rem 2rem;
            border: 2px solid #fff3d1;
            box-shadow: 0 12px 24px -8px #000000, 0 0 0 1px #b8861a inset, 0 0 30px rgba(232, 184, 75, 0.3);
        }

        .price-link.generator-btn:hover {
            box-shadow: 0 18px 30px -10px #000000, 0 0 0 1px #c99b2c inset, 0 0 50px rgba(255, 215, 100, 0.6);
        }

        .price-link.sales-small {
            background: linear-gradient(145deg, #7ac9b0, #4fa38a);
            color: #06201a;
        }

        .price-link.sales-barrel {
            background: linear-gradient(145deg, #7ab8d9, #4a8faf);
            color: #06212e;
        }

        .price-link.purchase-small {
            background: linear-gradient(145deg, #e8b87a, #cc9a4a);
            color: #261b0a;
        }

        .price-link.purchase-barrel {
            background: linear-gradient(145deg, #d98a7a, #b85c4a);
            color: #2b100a;
        }

        /* ---- COMMA SEPARATORS ---- */
        .comma {
            font-size: 2.2rem;
            font-weight: 300;
            color: #e8c96a;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            padding: 0 0.15rem;
            line-height: 1;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            min-width: 20px;
            text-align: center;
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 900px) {
            .button-row {
                padding: 1.2rem 1rem;
                border-radius: 60px;
                gap: 0.1rem 0.1rem;
            }
            .price-link {
                font-size: 0.85rem;
                padding: 0.8rem 1rem;
                min-width: 110px;
            }
            .price-link.generator-btn {
                font-size: 0.95rem;
                padding: 0.9rem 1.4rem;
            }
            .comma {
                font-size: 1.6rem;
                min-width: 14px;
            }
        }

        @media (max-width: 700px) {
            .button-row {
                flex-direction: column;
                border-radius: 2rem;
                padding: 1.5rem 1rem;
            }
            .comma {
                display: none;
            }
            .price-link {
                width: 100%;
                max-width: 320px;
                font-size: 1rem;
                padding: 1rem 1.2rem;
            }
            .price-link.generator-btn {
                font-size: 1.1rem;
                padding: 1.1rem 1.4rem;
            }
            h1 {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 400px) {
            .price-link {
                font-size: 0.8rem;
                padding: 0.8rem 0.8rem;
                min-width: unset;
            }
            .price-link.generator-btn {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <h1>⚡ Price List Links ⚡</h1>

    <!-- ---- BUTTONS SEPARATED BY COMMAS (each links to its own page) ---- -->
    <div class="button-row">

        <!-- 1. GENERATOR -->
        <a href="Pricelist/Pricelist_generator.html" class="price-link generator-btn" title="Go to Price Generator">
            ⚡ GENERATOR
        </a>

        <span class="comma">,</span>

        <!-- 2. SALES SMALL PACK -->
        <a href="Pricelist/ALH_SmallPack_Pricelist.html" class="price-link sales-small" title="Go to Sales Small Pack Price List">
            📦 SALES SMALL
        </a>

        <span class="comma">,</span>

        <!-- 3. SALES BARREL -->
        <a href="Pricelist/ALH_Barrel_Pricelist.html" class="price-link sales-barrel" title="Go to Sales Barrel Price List">
            🛢️ SALES BARREL
        </a>

        <span class="comma">,</span>

        <!-- 4. PURCHASE SMALL -->
        <a href="Pricelist/Purchase_small.html" class="price-link purchase-small" title="Go to Purchase Small Price List">
            💰 PURCHASE SMALL
        </a>

        <span class="comma">,</span>

        <!-- 5. PURCHASE BARREL -->
        <a href="Pricelist/Purchase_Barrel.html" class="price-link purchase-barrel" title="Go to Purchase Barrel Price List">
            💰 PURCHASE BARREL
        </a>

    </div>

</body>
</html>

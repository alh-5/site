<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Trai IIng | Track & Trace System - Complete Mandatory Fields</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d9e0e8 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .hero {
            background: linear-gradient(135deg, #0b2b3b 0%, #1a4a5f 100%);
            padding: 1.8rem 2.2rem;
            position: relative;
            border-bottom: 1px solid rgba(255, 215, 150, 0.3);
        }

        .hero::before {
            content: "⏺️⏺️";
            font-size: 100px;
            position: absolute;
            bottom: -20px;
            right: 20px;
            opacity: 0.08;
            pointer-events: none;
            font-family: monospace;
            letter-spacing: 8px;
        }

        .hero h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: white;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.75rem;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .badge {
            background: #f9b43a;
            color: #1e2f3a;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            display: inline-block;
            box-shadow: inset 0 1px 0 rgba(255,255,200,0.6), 0 2px 6px rgba(0,0,0,0.1);
        }

        .content {
            padding: 2rem 2rem 2.2rem 2rem;
        }

        .form-panel {
            width: 100%;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            flex: 1 1 240px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .address-field {
            flex: 2 1 320px;
        }
        .district-field {
            flex: 1 1 220px;
            position: relative;
        }
        .pincode-field {
            flex: 0.8 1 140px;
        }
        .rent-address-field {
            flex: 2 1 320px;
        }
        
        label {
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            color: #1f3e48;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f0f4f9;
            padding: 0.3rem 0.7rem;
            border-radius: 30px;
            width: fit-content;
        }

        input, textarea, select {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
            font-weight: 500;
            color: #0a2c38;
            resize: vertical;
        }

        input, select {
            text-transform: uppercase;
        }

        textarea {
            text-transform: none;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c7a5e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.2em;
            text-transform: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #2c7a5e;
            box-shadow: 0 0 0 3px rgba(44, 122, 94, 0.2);
            background: #feffef;
        }

        .mandatory-badge {
            font-size: 0.65rem;
            font-weight: 600;
            background: #ffe4e4;
            color: #c53030;
            padding: 0.2rem 0.5rem;
            border-radius: 30px;
            margin-left: 6px;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1.5px solid #e2e8f0;
            border-top: none;
            border-radius: 0 0 20px 20px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-top: -2px;
        }

        .autocomplete-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
            color: #1f3e48;
            border-bottom: 1px solid #f0f4f9;
        }

        .autocomplete-item:hover {
            background: #eef4ea;
            color: #2c7a5e;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
            border-top: 1px solid #e9edf2;
            padding-top: 1.8rem;
        }

        .btn {
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-outline {
            background: linear-gradient(95deg, #1f5e4c, #2a7f64);
            color: white;
            box-shadow: 0 6px 14px rgba(26, 90, 70, 0.3);
        }

        .btn-outline:hover:not(:disabled) {
            background: linear-gradient(95deg, #124a3b, #1f6a52);
            transform: translateY(-2px);
        }

        .btn-outline:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .status-msg {
            background: #eef4ea;
            padding: 0.7rem 1.3rem;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c5a44;
            border-left: 4px solid #2c7a5e;
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .thankyou-msg {
            background: linear-gradient(135deg, #2c7a5e 0%, #1f5e4c 100%);
            color: white;
            padding: 1rem 1.8rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInUp 0.4s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 45, 55, 0.95);
            color: #f0f9f4;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-weight: 500;
            z-index: 1000;
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
            pointer-events: none;
            border-left: 5px solid #f9b43a;
        }

        @media (max-width: 780px) {
            body { padding: 1rem; }
            .hero h1 { font-size: 1.4rem; }
            .content { padding: 1.5rem; }
            .btn { width: 100%; justify-content: center; }
        }

        .error-highlight {
            border-color: #e53e3e !important;
            background-color: #fff5f5 !important;
        }
        
        .district-valid-icon {
            position: absolute;
            right: 15px;
            top: 45px;
            font-size: 1rem;
            pointer-events: none;
            color: #2c7a5e;
        }
        
        /* Button visible by default */
        .btn-visible {
            display: inline-flex !important;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="hero">
        <h1>🗳️ Track And Trace System <span class="badge">Lawsohtun</span></h1>
        <p style="color: #d9eef5; font-size: 0.8rem; margin-top: 8px;">Trai IIng Ba Ai Wai | Verify & trace electoral footprint</p>
    </div>
    <div class="content">
        <div class="form-panel">
            <div class="form-row">
                <div class="input-group"><label>📛 KA KYRTENG <span class="mandatory-badge">Required</span></label><input type="text" id="name" placeholder="Kyrteng" autocomplete="off" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"></div>
                <div class="input-group"><label>👤 KA JAIT <span class="mandatory-badge">Required</span></label><input type="text" id="lastname" placeholder="Jait" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"></div>
                <div class="input-group"><label>🆔 EPIC NUMBER <span class="mandatory-badge">Required</span></label><input type="text" id="epic" placeholder="ABC1234567"></div>
                <div class="input-group"><label>📞 PHONE NO <span class="mandatory-badge">10 digits</span></label><input type="tel" id="phone" placeholder="9876543210" maxlength="10"></div>
            </div>
            <div class="form-row">
                <div class="input-group address-field"><label>🏠 ADDRESS/JAKA (KAT KUM HA EPIC) <span class="mandatory-badge">Required</span></label><textarea rows="2" id="address" placeholder="House No, Street, Village/City kat kum na EPIC card"></textarea></div>
                <div class="input-group district-field">
                    <label>🌆 DISTRICT <span class="mandatory-badge">Required</span></label>
                    <input type="text" id="district" placeholder="Pyndap District naba lah ai" autocomplete="off">
                    <div id="districtAutocomplete" class="autocomplete-list" style="display: none;"></div>
                </div>
                <div class="input-group pincode-field"><label>📮 PINCODE <span class="mandatory-badge">6 digits</span></label><input type="text" id="pincode" placeholder="793001" maxlength="6"></div>
            </div>
            <div class="form-row">
                <div class="input-group rent-address-field"><label>🏘️ ADDRESS/JAKA BA AI IING WAI <span class="mandatory-badge">Required</span></label><textarea rows="2" id="rentAddress" placeholder="Jaka IIng ai Wai"></textarea></div>
                <div class="input-group">
                    <label>🧱 BLOCK <span class="mandatory-badge">Required</span></label>
                    <select id="block">
                        <option value="" disabled selected>-- Select Block --</option>
                        <option value="BLOCK 1">BLOCK 1</option>
                        <option value="BLOCK 2">BLOCK 2</option>
                        <option value="BLOCK 3">BLOCK 3</option>
                        <option value="BLOCK 4">BLOCK 4</option>
                        <option value="BLOCK 5">BLOCK 5</option>
                        <option value="BLOCK 6">BLOCK 6</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>🏷️ KATNO NGUT AI WAI <span class="mandatory-badge">Required</span></label>
                    <input type="text" id="rentNo" placeholder="Katno ngut phi ai iing wai" autocomplete="off">
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-outline" id="syncToSheetBtn">💾 Submit</button>
            </div>
            <div id="formStatus" class="status-msg">✅ Sngewbha ban da Cross Checked ia kaba phi pyndap shwa ban submit</div>
            <div id="thankyouMessage" style="display: none;"></div>
        </div>
    </div>
</div>

<script>
    // ======================= DISTRICT MASTER LIST (ENFORCED AUTO-SUGGESTION) =======================
    const districts = [
        "EAST GARO HILLS", "NORTH GARO HILLS", "SOUTH GARO HILLS", "SOUTH WEST GARO HILLS",
        "WEST GARO HILLS", "EAST JAINTIA HILLS", "WEST JAINTIA HILLS", "EAST KHASI HILLS",
        "EASTERN WEST KHASI HILLS", "SOUTH WEST KHASI HILLS", "WEST KHASI HILLS", "RI BHOI", "OTHERS"
    ];
    
    // IMPORTANT: REPLACE THIS WITH YOUR ACTUAL WEB APP URL AFTER DEPLOYMENT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxgM4dxm98ld2TIAdtqL-2aM5s-p0NSxln_3AhZuc9LSeafjDJwEXrVZeaZHrGJzuG/exec";
    
    let isSubmitting = false;
    let districtSelectedFromList = false;
    
    // Enhanced district autocomplete with strict enforcement: user MUST select from suggestions.
    function setupStrictDistrictAutocomplete() {
        const districtInput = document.getElementById('district');
        const autocompleteDiv = document.getElementById('districtAutocomplete');
        
        function filterAndShowSuggestions(inputValue) {
            const value = inputValue.trim().toLowerCase();
            autocompleteDiv.innerHTML = '';
            if (!value) {
                autocompleteDiv.style.display = 'none';
                return false;
            }
            const filtered = districts.filter(d => d.toLowerCase().includes(value));
            if (filtered.length === 0) {
                autocompleteDiv.style.display = 'none';
                return false;
            }
            autocompleteDiv.style.display = 'block';
            filtered.forEach((districtName) => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.textContent = districtName;
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    districtInput.value = districtName;
                    districtSelectedFromList = true;
                    districtInput.classList.remove('error-highlight');
                    autocompleteDiv.style.display = 'none';
                    districtInput.dispatchEvent(new Event('change', { bubbles: true }));
                });
                autocompleteDiv.appendChild(item);
            });
            return true;
        }
        
        districtInput.addEventListener('input', function(e) {
            const currentVal = this.value;
            if (currentVal === "") {
                districtSelectedFromList = false;
                districtInput.classList.remove('error-highlight');
            } else {
                if (!districts.includes(currentVal.trim())) {
                    districtSelectedFromList = false;
                }
                districtInput.classList.remove('error-highlight');
            }
            filterAndShowSuggestions(currentVal);
        });
        
        districtInput.addEventListener('blur', function() {
            setTimeout(() => {
                const currentVal = this.value.trim();
                const isValidDistrict = districts.includes(currentVal);
                if (currentVal !== "" && !isValidDistrict) {
                    districtInput.classList.add('error-highlight');
                    setStatusMessage("SNGEWBHA PYNDAP IAKA DISTRICT KABA DEI.", true);
                    showToast("DISTRICT KAM IA HAP", true);
                    districtSelectedFromList = false;
                } else if (currentVal !== "" && isValidDistrict) {
                    districtSelectedFromList = true;
                    districtInput.classList.remove('error-highlight');
                } else if (currentVal === "") {
                    districtSelectedFromList = false;
                }
                autocompleteDiv.style.display = 'none';
            }, 180);
        });
        
        document.addEventListener('click', (e) => {
            if (e.target !== districtInput && !autocompleteDiv.contains(e.target)) {
                autocompleteDiv.style.display = 'none';
            }
        });
        
        districtInput.addEventListener('focus', function() {
            const currentVal = this.value;
            if (currentVal && !districts.includes(currentVal.trim())) {
                districtSelectedFromList = false;
                filterAndShowSuggestions(currentVal);
            } else if (!currentVal) {
                autocompleteDiv.style.display = 'none';
            }
        });
        
        districtInput.addEventListener('change', function() {
            const val = this.value.trim();
            if (val && !districts.includes(val)) {
                districtSelectedFromList = false;
                districtInput.classList.add('error-highlight');
            } else if (val && districts.includes(val)) {
                districtSelectedFromList = true;
                districtInput.classList.remove('error-highlight');
            }
        });
    }
    
    function showToast(message, isError = false) {
        const existingToast = document.querySelector('.toast-msg');
        if(existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = isError ? `⚠️ ${message}` : `✅ ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }
    
    function setStatusMessage(text, isError = false) {
        const statusDiv = document.getElementById('formStatus');
        if(statusDiv) {
            statusDiv.innerHTML = isError ? `❌ ${text}` : `ℹ️ ${text}`;
            statusDiv.style.borderLeftColor = isError ? '#e25c5c' : '#2c7a5e';
        }
    }
    
    function showThankYouMessage() {
        const thankYouDiv = document.getElementById('thankyouMessage');
        if (thankYouDiv) {
            thankYouDiv.innerHTML = `<div class="thankyou-msg">🙏 Khublei shibun! 🙏<br>ngin sa phone ia phi na bynta ka verification.</div>`;
            thankYouDiv.style.display = 'block';
            setTimeout(() => { thankYouDiv.style.display = 'none'; }, 8000);
        }
    }
    
    // CLEAR ALL FORM FIELDS and reset district flag
    function clearAllFormFields() {
        const textFields = ['name', 'lastname', 'epic', 'phone', 'address', 'district', 'pincode', 'rentAddress', 'rentNo'];
        textFields.forEach(id => {
            const field = document.getElementById(id);
            if (field) {
                field.value = '';
                field.classList.remove('error-highlight');
            }
        });
        
        const blockSelect = document.getElementById('block');
        if (blockSelect) {
            blockSelect.value = '';
            const options = blockSelect.options;
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === "") {
                    options[i].selected = true;
                    break;
                }
            }
            blockSelect.classList.remove('error-highlight');
        }
        
        districtSelectedFromList = false;
        const districtInput = document.getElementById('district');
        if (districtInput) {
            districtInput.classList.remove('error-highlight');
        }
        
        const autoDiv = document.getElementById('districtAutocomplete');
        if (autoDiv) autoDiv.style.display = 'none';
        
        document.querySelectorAll('.error-highlight').forEach(el => el.classList.remove('error-highlight'));
    }
    
    // Enable submit button and reset its state for next submission
    function enableSubmitButton() {
        const submitBtn = document.getElementById('syncToSheetBtn');
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '💾 Submit';
            isSubmitting = false;
            // Ensure button is visible (in case any previous hide attempts)
            submitBtn.style.display = 'inline-flex';
        }
    }
    
    function validateForm() {
        const name = document.getElementById('name').value.trim();
        const lastname = document.getElementById('lastname').value.trim();
        const epic = document.getElementById('epic').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const address = document.getElementById('address').value.trim();
        const pincode = document.getElementById('pincode').value.trim();
        const district = document.getElementById('district').value.trim();
        const rentAddress = document.getElementById('rentAddress').value.trim();
        const block = document.getElementById('block').value;
        const rentNo = document.getElementById('rentNo').value.trim();
        
        document.querySelectorAll('.error-highlight').forEach(el => el.classList.remove('error-highlight'));
        
        if(!name) { setStatusMessage("PYNDAP IAKA KYRTENG", true); document.getElementById('name').focus(); document.getElementById('name').classList.add('error-highlight'); return false; }
        if(!lastname) { setStatusMessage("PYNDAP IAKA JAIT", true); document.getElementById('lastname').focus(); document.getElementById('lastname').classList.add('error-highlight'); return false; }
        if(!epic) { setStatusMessage("PYNDAP IAKA EPIC NUMBER", true); document.getElementById('epic').focus(); document.getElementById('epic').classList.add('error-highlight'); return false; }
        if(!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) { setStatusMessage("PYNDAP PHONE NUMBER", true); document.getElementById('phone').focus(); document.getElementById('phone').classList.add('error-highlight'); return false; }
        if(!address) { setStatusMessage("PYNDAP IAKA EPIC Address", true); document.getElementById('address').focus(); document.getElementById('address').classList.add('error-highlight'); return false; }
        
        if(!district) { 
            setStatusMessage("PYNDAP IAKA DISTRICT", true); 
            document.getElementById('district').focus(); 
            document.getElementById('district').classList.add('error-highlight'); 
            return false; 
        }
        if(!districts.includes(district)) {
            setStatusMessage("DISTRICT DONKAM BAN JIED TANG NABA LAH BUH.", true);
            document.getElementById('district').classList.add('error-highlight');
            document.getElementById('district').focus();
            return false;
        }
        if(!districtSelectedFromList && districts.includes(district)) {
            districtSelectedFromList = true;
        }
        if(!districtSelectedFromList && districts.includes(district) === false) {
            setStatusMessage("JIED IA KA DISTRICT NA DROPDOWN BA LAH BUH.", true);
            document.getElementById('district').classList.add('error-highlight');
            return false;
        }
        
        if(!pincode || !/^\d{6}$/.test(pincode)) { setStatusMessage("PYNDAP IA U PINCODE", true); document.getElementById('pincode').focus(); document.getElementById('pincode').classList.add('error-highlight'); return false; }
        if(!rentAddress) { setStatusMessage("PYNDAP IAKA JAKA BA PHI AI IING WAI", true); document.getElementById('rentAddress').focus(); document.getElementById('rentAddress').classList.add('error-highlight'); return false; }
        if(!block) { setStatusMessage("HA BLOCK AIU PHI AI IING WAI", true); document.getElementById('block').focus(); document.getElementById('block').classList.add('error-highlight'); return false; }
        if(!rentNo || !/^\d+$/.test(rentNo)) { setStatusMessage("KATNO NGUT PHI AI IING WAI", true); document.getElementById('rentNo').focus(); document.getElementById('rentNo').classList.add('error-highlight'); return false; }
        
        return true;
    }
    
    function getFormData() {
        return {
            timestamp: new Date().toISOString(),
            kyrteng: document.getElementById('name').value.trim().toUpperCase(),
            Jait: document.getElementById('lastname').value.trim().toUpperCase(),
            epicNumber: document.getElementById('epic').value.trim().toUpperCase(),
            phone: document.getElementById('phone').value.replace(/[^0-9]/g, ''),
            addressEPIC: document.getElementById('address').value.trim().toUpperCase(),
            district: document.getElementById('district').value.trim(),
            pincode: document.getElementById('pincode').value,
            rentalAddress: document.getElementById('rentAddress').value.trim().toUpperCase(),
            block: document.getElementById('block').value,
            iingwai: document.getElementById('rentNo').value.replace(/\D/g, ''),
            source: "TrackAndTrace_WebApp_StrictDistrict"
        };
    }
    
    async function submitToSheet(formData) {
        const encodedData = new URLSearchParams();
        encodedData.append('data', JSON.stringify(formData));
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: encodedData.toString()
            });
            return { success: true, message: 'Data submitted successfully' };
        } catch (error) {
            console.error('Fetch error:', error);
            return { success: false, message: error.message };
        }
    }
    
    async function handleSubmit() {
        if (isSubmitting) return;
        if(!validateForm()) return;
        
        const submitBtn = document.getElementById('syncToSheetBtn');
        const originalText = submitBtn.innerHTML;
        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loader"></span> Submitting...';
        setStatusMessage("⏳ Khublei shibun na bynta ka por jong phi", false);
        
        const formData = getFormData();
        const result = await submitToSheet(formData);
        
        if(result.success) {
            setStatusMessage("✅ Success! Record saved successfully.", false);
            showToast("Ngi lah record ia Data jong phi ngin sa phone ban leh verification.", false);
            showThankYouMessage();
            
            // CLEAR ALL FORM DATA
            clearAllFormFields();
            
            // ENABLE SUBMIT BUTTON for next submission (form cleared, ready for new entry)
            enableSubmitButton();
            
            setStatusMessage("✅ Khublei na bynta ka jing pyndap ia kane ka form", false);
        } else {
            setStatusMessage(`❌ Failed: ${result.message}`, true);
            showToast(`Error: ${result.message}`, true);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    }
    
    function setupFieldRestrictions() {
        document.getElementById('phone').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
        });
        document.getElementById('pincode').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
        document.getElementById('rentNo').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });
        document.getElementById('epic').addEventListener('input', function() {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
        ['name', 'lastname', 'address', 'rentAddress'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
        });
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        setupStrictDistrictAutocomplete();
        setupFieldRestrictions();
        document.getElementById('syncToSheetBtn').addEventListener('click', handleSubmit);
        
        if (SCRIPT_URL === "YOUR_WEB_APP_URL_HERE" || SCRIPT_URL.includes("script.google.com")) {
            console.log("Using Google Apps Script URL, ensure it's correct.");
        }
    });
</script>
</body>
</html>
